name: Staff Staging maintenance
on:
  schedule:
    # Daily 21:35 Asia/Shanghai; attachment cleanup also runs in this small test environment.
    - cron: '35 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect without changing appointments or deleting attachments
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/next/staff-platform' && 'cloudflare-staff-staging' || format('staff-maintenance-dispatch-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'schedule' && vars.STAFF_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch maintenance to protected integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staff-staging-maintenance.yml --repo "$GITHUB_REPOSITORY" --ref next/staff-platform -f dry_run=false
  maintain:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/next/staff-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staff-staging-migrations
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Maintain Staff D1 and private R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAFF_MAINTENANCE_API_TOKEN }}
          APPLY: ${{ !inputs.dry_run }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          args=(--staff-staging --dry-run)
          if [[ "$APPLY" == "true" ]]; then args=(--staff-staging --apply); fi
          npm run appointments:expire -- "${args[@]}"
          npm run attachments:cleanup -- "${args[@]}"
