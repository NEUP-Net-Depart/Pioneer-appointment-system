name: Weekly roster collection automation
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment database
        type: choice
        options: [staff-staging, preview, production]
        default: staff-staging
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/next/staff-platform' && 'cloudflare-staff-staging' || format('roster-automation-{0}', inputs.target || 'dispatch') }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'schedule' && vars.STAFF_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch to Staff integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run roster-automation.yml --repo "$GITHUB_REPOSITORY" --ref next/staff-platform -f target=staff-staging
  collect:
    if: github.event_name == 'workflow_dispatch' && ((inputs.target == 'staff-staging' && github.ref == 'refs/heads/next/staff-platform') || (inputs.target == 'preview' && github.ref == 'refs/heads/dev') || (inputs.target == 'production' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target == 'staff-staging' && 'staff-staging-migrations' || inputs.target == 'preview' && 'preview-migrations' || 'production-migrations' }}
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publish due collections and carry forward availability
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.target == 'staff-staging' && secrets.CLOUDFLARE_STAFF_MAINTENANCE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          args=(--apply)
          if [[ "$TARGET" == "staff-staging" ]]; then args+=(--staff-staging); fi
          if [[ "$TARGET" == "preview" ]]; then args+=(--preview); fi
          node scripts/roster-automation.mjs "${args[@]}"
