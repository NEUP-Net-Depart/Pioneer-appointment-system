name: Request production release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: piper-release-request
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify default branch and maintainers
        uses: actions/github-script@v7
        with:
          script: |
            const {data: repository} = await github.rest.repos.get(context.repo);
            if (context.ref !== `refs/heads/${repository.default_branch}`) {
              throw new Error('Run this workflow on the default branch.');
            }
            for (const username of new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR])) {
              if (!username) throw new Error('Missing triggering actor.');
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
              if (!['maintain', 'admin'].includes(data.role_name ?? data.permission)) {
                throw new Error('Only repository maintainers/admins may request a production release.');
              }
            }
            core.notice('Release request accepted.');
