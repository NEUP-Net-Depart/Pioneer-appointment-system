name: Clean expired attachments
on:
  schedule:
    # Sunday 19:17 UTC = Monday 03:17 Asia/Shanghai.
    - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to clean
        type: choice
        default: both
        options: [both, production, preview]
      dry_run:
        description: Only inspect candidates (no deletions)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  dispatch-maintenance:
    # Schedules run on the default branch (dev); credentials remain main-only.
    if: github.event_name == 'schedule' && vars.ATTACHMENT_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch scheduled cleanup on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cleanup-attachments.yml --repo "$GITHUB_REPOSITORY" --ref main -f environment=both -f dry_run=false
  select-targets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environments: ${{ steps.targets.outputs.environments }}
    steps:
      - name: Validate maintenance branch and select environments
        id: targets
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run maintenance workflows from main. Scheduled runs dispatch to main automatically."
            exit 1
          fi
          case "$TARGET_ENVIRONMENT" in
            both) echo 'environments=["production","preview"]' >> "$GITHUB_OUTPUT" ;;
            production|preview) printf 'environments=["%s"]\n' "$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Choose production, preview, or both."; exit 1 ;;
          esac
  cleanup:
    needs: select-targets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ matrix.environment == 'production' && 'production' || 'preview-maintenance' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.select-targets.outputs.environments) }}
    concurrency:
      group: attachments-cleanup-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Clean attachments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets[matrix.environment == 'production' && 'CLOUDFLARE_API_TOKEN' || 'CLOUDFLARE_PREVIEW_MAINTENANCE_API_TOKEN'] }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          APPLY_CLEANUP: ${{ !inputs.dry_run }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          args=(--dry-run)
          if [[ "$APPLY_CLEANUP" == "true" ]]; then args=(--apply); fi
          if [[ "$TARGET_ENVIRONMENT" == "preview" ]]; then args+=(--preview); fi
          npm run attachments:cleanup -- "${args[@]}"
