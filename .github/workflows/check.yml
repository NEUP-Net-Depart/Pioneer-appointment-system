name: Cloudflare CI and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Serialize the full dev verification, migration, publication and smoke chain.
# Other branches retain their job-level deployment concurrency.
concurrency:
  group: ${{ github.ref == 'refs/heads/dev' && 'cloudflare-dev-release' || format('cloudflare-ci-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  checks:
    # Production pushes and same-repository dev -> main PRs reuse dev verification.
    if: >-
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') &&
      !(github.event_name == 'pull_request' &&
        github.base_ref == 'main' && github.head_ref == 'dev' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate manual release branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "::error::Manual releases require a non-main branch. Production releases run on pushes to main."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:checks
  browser:
    name: browser
    # Run alongside checks while preserving the release and promotion exemptions.
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/')) &&
      !(github.event_name == 'pull_request' &&
        github.base_ref == 'main' && github.head_ref == 'dev' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Run desktop and mobile workflow checks
        run: npm run test:e2e
        timeout-minutes: 12
      - name: Preserve isolated UI acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staff-platform-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/
          if-no-files-found: ignore
          retention-days: 14
  test:
    needs: [checks, browser]
    if: always() && needs.checks.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
  migrate-preview:
    needs: test
    if: github.ref == 'refs/heads/dev' && ((github.event_name == 'push' && github.event.deleted != true) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-migrations
      deployment: false
    concurrency:
      group: cloudflare-preview-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Migrate shared Preview D1 from dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/rehearse-preview.mjs
          node scripts/ci-release.mjs --migrate-preview
  release:
    needs: [test, migrate-preview]
    # Main pushes release directly; Preview still requires successful verification.
    if: >-
      always() && !cancelled() &&
      startsWith(github.ref, 'refs/heads/') &&
      ((github.event_name == 'push' && github.event.deleted != true) ||
       (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) &&
      (github.ref == 'refs/heads/main' ||
       (needs.test.result == 'success' &&
        (needs.migrate-preview.result == 'success' ||
         (github.ref != 'refs/heads/dev' && needs.migrate-preview.result == 'skipped'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.production.outputs.url || steps.preview.outputs.url }}
    concurrency:
      group: cloudflare-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Migrate Production D1, publish Pages, and verify HTTP
        id: production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_INTERACTIONS: ${{ vars.POSTHOG_INTERACTIONS }}
          POSTHOG_REPLAY_ENABLED: ${{ vars.POSTHOG_REPLAY_ENABLED }}
          POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.POSTHOG_REPLAY_SAMPLE_RATE }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
          TELEMETRY_INTERACTIONS: ${{ vars.TELEMETRY_INTERACTIONS }}
          TELEMETRY_SAMPLE_RATE: ${{ vars.TELEMETRY_SAMPLE_RATE }}
          TELEMETRY_POLL_SAMPLE_RATE: ${{ vars.TELEMETRY_POLL_SAMPLE_RATE }}
          OBSERVABILITY_LOGS: ${{ vars.OBSERVABILITY_LOGS }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/ci-release.mjs
      - name: Publish branch Preview and verify its URL
        id: preview
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_INTERACTIONS: ${{ vars.POSTHOG_INTERACTIONS }}
          POSTHOG_REPLAY_ENABLED: ${{ vars.POSTHOG_REPLAY_ENABLED }}
          POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.POSTHOG_REPLAY_SAMPLE_RATE }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
          TELEMETRY_INTERACTIONS: ${{ vars.TELEMETRY_INTERACTIONS }}
          TELEMETRY_SAMPLE_RATE: ${{ vars.TELEMETRY_SAMPLE_RATE }}
          TELEMETRY_POLL_SAMPLE_RATE: ${{ vars.TELEMETRY_POLL_SAMPLE_RATE }}
          OBSERVABILITY_LOGS: ${{ vars.OBSERVABILITY_LOGS }}
          PREVIEW_MIGRATIONS_APPLIED: ${{ needs.migrate-preview.result == 'success' && 'true' || 'false' }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/ci-release.mjs
