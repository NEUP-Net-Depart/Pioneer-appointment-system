name: Cloudflare CI and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Serialize the full dev verification, migration, publication and smoke chain.
# Other branches retain their job-level deployment concurrency.
concurrency:
  group: ${{ github.ref == 'refs/heads/dev' && 'cloudflare-dev-release' || format('cloudflare-ci-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate manual release branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "::error::Manual releases require a non-main branch. Production releases run on pushes to main."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - name: Preserve isolated UI acceptance screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staff-platform-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/field-workflow/**/*.png
          if-no-files-found: ignore
          retention-days: 14
  migrate-preview:
    needs: test
    if: github.ref == 'refs/heads/dev' && ((github.event_name == 'push' && github.event.deleted != true) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-migrations
      deployment: false
    concurrency:
      group: cloudflare-preview-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Migrate shared Preview D1 from dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/rehearse-preview.mjs
          node scripts/ci-release.mjs --migrate-preview
  release:
    needs: [test, migrate-preview]
    if: >-
      always() && !cancelled() && needs.test.result == 'success' &&
      (needs.migrate-preview.result == 'success' || needs.migrate-preview.result == 'skipped') &&
      startsWith(github.ref, 'refs/heads/') &&
      ((github.event_name == 'push' && github.event.deleted != true) ||
       (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.production.outputs.url || steps.preview.outputs.url }}
    concurrency:
      group: cloudflare-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Migrate Production D1, publish Pages, and verify HTTP
        id: production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/ci-release.mjs
      - name: Publish branch Preview and verify its URL
        id: preview
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_MIGRATIONS_APPLIED: ${{ needs.migrate-preview.result == 'success' && 'true' || 'false' }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/ci-release.mjs
